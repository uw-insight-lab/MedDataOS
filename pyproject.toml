[project]
name = "meddataos"
version = "0.2.0"
description = "Web UI, datactrl case access, and specialist agents for one local case."
authors = [{ name = "Joshua Siraj", email = "joshua.siraj@ryerson.ca" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.104.0,<1",
    "uvicorn[standard]>=0.24.0,<1",
    "python-multipart>=0.0.6,<1",
    "websockets>=12.0,<18",
    "python-dotenv>=1.0.0,<2",
    "pydantic>=2.13.4,<3",
    "med-imagetools>=2.15.0,<3",
    "pypdf>=6.0.0,<7",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<10"]
parquet = ["pyarrow>=14.0.0"]
specialists = [
    "google-genai>=1.0.0",
    "python-dateutil>=2.9",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# datactrl and specialists are importable packages. The web app in web/ and the
# example agent in examples/ run as scripts and are not part of the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/datactrl", "specialists"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["datactrl"]
exclude = ["\\.pixi/"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
extend = "configs/ruff.toml"
